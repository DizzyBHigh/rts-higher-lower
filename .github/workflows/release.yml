name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release files
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(python - <<'PY'
          import json
          with open('site/rts.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data['name'])
          PY
          )
          IMPORT_SOURCE="$(python - <<'PY'
          import json
          with open('site/rts.json', encoding='utf-8') as f:
              data = json.load(f)
          print(data.get('publish', {}).get('importFile', 'RTS Extension - Import Code.txt'))
          PY
          )"
          PUBLISH_OVERLAY="$(python - <<'PY'
          import json
          with open('site/rts.json', encoding='utf-8') as f:
              data = json.load(f)
          print(str(data.get('publish', {}).get('overlay', False)).lower())
          PY
          )"
          IMPORT_NAME="${NAME} v${VERSION} - Import Code.txt"
          test -f "${IMPORT_SOURCE}"
          mkdir -p dist
          cp "${IMPORT_SOURCE}" "dist/${IMPORT_NAME}"
          if [ "${PUBLISH_OVERLAY}" = "true" ]; then
            test -d overlay
            zip -qr dist/overlay.zip overlay
            mv dist/overlay.zip dist/overlay
          fi
          echo "IMPORT_PATH=dist/${IMPORT_NAME}" >> "$GITHUB_ENV"
          echo "PUBLISH_OVERLAY=${PUBLISH_OVERLAY}" >> "$GITHUB_ENV"

      - name: Check placeholder was replaced
        shell: bash
        run: |
          if grep -q "RTS EXTENSION IMPORT CODE PLACEHOLDER" "$IMPORT_PATH"; then
            echo "The Streamer.bot import code is still the template placeholder."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$PUBLISH_OVERLAY" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              "$IMPORT_PATH" \
              dist/overlay \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" \
              "$IMPORT_PATH" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
